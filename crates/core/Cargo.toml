[package]
name = "castpane-core"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
description = "CastPane core: plugin host, process supervisor and window placement"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

# Development-only fake plugin, used by tests/host_roundtrip.rs and for UI
# work before the real engines are vendored.
[[bin]]
name = "mock-plugin"
path = "src/bin/mock_plugin.rs"
