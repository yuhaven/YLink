[package]
name = "castpane"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
description = "CastPane desktop shell"
# Two binaries: the GUI (`castpane`) and the console companion. Tauri must
# know which one is the app.
default-run = "castpane"

[lib]
name = "castpane_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

# Console binary: reliable stdout/stderr for --diagnose in terminals.
[[bin]]
name = "castpane-cli"
path = "src/bin/cli.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
castpane-core = { path = "../../../crates/core" }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_System_Console"] }
